<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .term-title { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif; font-size: 12px; fill: #94a3b8; font-weight: 600; letter-spacing: 0.3px; }
    .term-code { font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', Monaco, Consolas, monospace; font-size: 11.5px; fill: #e2e8f0; }
    .term-dim { fill: #64748b; }
    .term-amber { fill: #f59e0b; font-weight: 600; }
    .term-green { fill: #10b981; font-weight: 600; }
    .term-cyan { fill: #38bdf8; font-weight: 600; }
    .term-purple { fill: #c084fc; font-weight: 600; }
    .term-rose { fill: #fb7185; font-weight: 600; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif; font-size: 10px; font-weight: 700; text-transform: uppercase; }

    /* Waveform Animation */
    @keyframes wavePulse {
      0%, 100% { height: 10px; y: 155px; opacity: 0.4; }
      50% { height: 48px; y: 117px; opacity: 1; }
    }
    .w-1  { animation: wavePulse 0.9s ease-in-out infinite 0.05s; }
    .w-2  { animation: wavePulse 0.7s ease-in-out infinite 0.20s; }
    .w-3  { animation: wavePulse 1.1s ease-in-out infinite 0.35s; }
    .w-4  { animation: wavePulse 0.8s ease-in-out infinite 0.10s; }
    .w-5  { animation: wavePulse 1.3s ease-in-out infinite 0.45s; }
    .w-6  { animation: wavePulse 0.6s ease-in-out infinite 0.25s; }
    .w-7  { animation: wavePulse 1.0s ease-in-out infinite 0.15s; }
    .w-8  { animation: wavePulse 0.85s ease-in-out infinite 0.50s; }
    .w-9  { animation: wavePulse 1.2s ease-in-out infinite 0.30s; }
    .w-10 { animation: wavePulse 0.75s ease-in-out infinite 0.40s; }
    .w-11 { animation: wavePulse 1.05s ease-in-out infinite 0.05s; }
    .w-12 { animation: wavePulse 0.95s ease-in-out infinite 0.55s; }
    .w-13 { animation: wavePulse 0.8s ease-in-out infinite 0.18s; }
    .w-14 { animation: wavePulse 1.15s ease-in-out infinite 0.38s; }
    .w-15 { animation: wavePulse 0.7s ease-in-out infinite 0.22s; }
    .w-16 { animation: wavePulse 1.25s ease-in-out infinite 0.48s; }
    .w-17 { animation: wavePulse 0.65s ease-in-out infinite 0.12s; }
    .w-18 { animation: wavePulse 1.0s ease-in-out infinite 0.32s; }
    .w-19 { animation: wavePulse 0.9s ease-in-out infinite 0.52s; }
    .w-20 { animation: wavePulse 0.85s ease-in-out infinite 0.28s; }
    .w-21 { animation: wavePulse 1.1s ease-in-out infinite 0.42s; }
    .w-22 { animation: wavePulse 0.75s ease-in-out infinite 0.16s; }
    .w-23 { animation: wavePulse 1.05s ease-in-out infinite 0.36s; }
    .w-24 { animation: wavePulse 0.9s ease-in-out infinite 0.08s; }

    /* Indicator Pulse */
    @keyframes pulseLed {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.92); }
    }
    .led-live { animation: pulseLed 1.6s ease-in-out infinite; transform-origin: 28px 74px; }
  </style>

  <!-- Outer Window Shadow & Frame -->
  <rect x="10" y="10" width="860" height="500" rx="14" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Window Header -->
  <rect x="10" y="10" width="860" height="40" rx="14" fill="url(#headerGrad)" />
  <rect x="10" y="38" width="860" height="12" fill="#0f172a" />
  <line x1="10" y1="50" x2="870" y2="50" stroke="#334155" stroke-width="1" />

  <!-- macOS Window Controls (Traffic Lights) -->
  <circle cx="32" cy="30" r="6" fill="#ff5f56" stroke="#e0443e" stroke-width="0.5" />
  <circle cx="52" cy="30" r="6" fill="#ffbd2e" stroke="#dea123" stroke-width="0.5" />
  <circle cx="72" cy="30" r="6" fill="#27c93f" stroke="#1aab29" stroke-width="0.5" />

  <!-- Window Title -->
  <text x="440" y="34" text-anchor="middle" class="term-title">HamzaBuild AI — Voice Telemetry Console v3.4 (Retell AI + Twilio SIP + Apollo.io)</text>

  <!-- HUD Telemetry Top Bar -->
  <rect x="24" y="60" width="832" height="116" rx="8" fill="#090d16" stroke="#1e293b" stroke-width="1" />

  <!-- Live Call Badge -->
  <g class="led-live">
    <circle cx="42" cy="80" r="5" fill="#10b981" filter="url(#glow)" />
  </g>
  <rect x="54" y="71" width="170" height="18" rx="4" fill="#064e3b" stroke="#059669" stroke-width="0.8" />
  <text x="139" y="83" text-anchor="middle" fill="#34d399" class="badge-text">● LIVE CALL CONNECTED [SIP-AU-01]</text>

  <!-- Latency Gauge Card -->
  <rect x="236" y="68" width="370" height="24" rx="4" fill="#0f172a" stroke="#334155" stroke-width="0.8" />
  <text x="246" y="84" class="term-code">
    <tspan class="term-dim">TTFT: </tspan><tspan class="term-green">685ms</tspan>
    <tspan class="term-dim"> | STT: </tspan><tspan class="term-cyan">165ms</tspan>
    <tspan class="term-dim"> | LLM: </tspan><tspan class="term-amber">192ms</tspan>
    <tspan class="term-dim"> | TTS: </tspan><tspan class="term-purple">138ms</tspan>
  </text>

  <!-- SLA Pill -->
  <rect x="618" y="71" width="110" height="18" rx="4" fill="#1e1b4b" stroke="#6366f1" stroke-width="0.8" />
  <text x="673" y="83" text-anchor="middle" fill="#a5b4fc" class="badge-text">SLA: &lt;850MS (PASS)</text>

  <!-- Speed to Lead Counter -->
  <rect x="738" y="71" width="106" height="18" rx="4" fill="#3b0764" stroke="#a855f7" stroke-width="0.8" />
  <text x="791" y="83" text-anchor="middle" fill="#e9d5ff" class="badge-text">SPEED-TO-LEAD: 44s</text>

  <!-- Firmographic Enrichment Context Ribbon -->
  <text x="42" y="112" class="term-code">
    <tspan class="term-dim">PROSPECT: </tspan><tspan class="term-cyan">Sarah Jenkins (Head of Growth)</tspan>
    <tspan class="term-dim"> | ORG: </tspan><tspan class="term-amber">Acme Growth Media</tspan>
    <tspan class="term-dim"> | SIZE: </tspan><tspan class="term-green">38 Staff</tspan>
    <tspan class="term-dim"> | REV: </tspan><tspan class="term-purple">$4.5M</tspan>
  </text>
  <text x="42" y="130" class="term-code">
    <tspan class="term-dim">STACK: </tspan><tspan fill="#f43f5e">WooCommerce</tspan><tspan class="term-dim">, PostgreSQL, GoHighLevel, Klaviyo</tspan>
    <tspan class="term-dim"> | GEO: </tspan><tspan class="term-cyan">Melbourne, Australia</tspan>
    <tspan class="term-dim"> | ENRICH: </tspan><tspan class="term-green">314ms</tspan>
  </text>

  <!-- Waveform Equalizer Display (24 animated vertical bars) -->
  <g id="waveform-group">
    <text x="42" y="158" class="term-code term-dim" font-size="9.5">AUDIO TELEMETRY [CARTESIA SONIC 24kHz DUPLEX STREAM]:</text>
    <rect class="w-1" x="380" y="155" width="6" height="10" rx="3" fill="url(#waveGrad)" />
    <rect class="w-2" x="392" y="155" width="6" height="10" rx="3" fill="url(#waveGrad)" />
    <rect class="w-3" x="404" y="155" width="6" height="10" rx="3" fill="url(#waveGrad)" />
    <rect class="w-4" x="416" y="155" width="6" height="10" rx="3" fill="url(#waveGrad)" />
    <rect class="w-5" x="428" y="155" width="6" height="10" rx="3" fill="url(#waveGrad)" />
    <rect class="w-6" x="440" y="155" width="6" height="10" rx="3" fill="url(#waveGrad)" />
    <rect class="w-7" x="452" y="155" width="6" height="10" rx="3" fill="url(#waveGrad)" />
    <rect class="w-8" x="464" y="155" width="6" height="10" rx="3" fill="url(#waveGrad)" />
    <rect class="w-9" x="476" y="155" width="6" height="10" rx="3" fill="url(#waveGrad)" />
    <rect class="w-10" x="488" y="155" width="6" height="10" rx="3" fill="url(#waveGrad)" />
    <rect class="w-11" x="500" y="155" width="6" height="10" rx="3" fill="url(#waveGrad)" />
    <rect class="w-12" x="512" y="155" width="6" height="10" rx="3" fill="url(#waveGrad)" />
    <rect class="w-13" x="524" y="155" width="6" height="10" rx="3" fill="url(#waveGrad)" />
    <rect class="w-14" x="536" y="155" width="6" height="10" rx="3" fill="url(#waveGrad)" />
    <rect class="w-15" x="548" y="155" width="6" height="10" rx="3" fill="url(#waveGrad)" />
    <rect class="w-16" x="560" y="155" width="6" height="10" rx="3" fill="url(#waveGrad)" />
    <rect class="w-17" x="572" y="155" width="6" height="10" rx="3" fill="url(#waveGrad)" />
    <rect class="w-18" x="584" y="155" width="6" height="10" rx="3" fill="url(#waveGrad)" />
    <rect class="w-19" x="596" y="155" width="6" height="10" rx="3" fill="url(#waveGrad)" />
    <rect class="w-20" x="608" y="155" width="6" height="10" rx="3" fill="url(#waveGrad)" />
    <rect class="w-21" x="620" y="155" width="6" height="10" rx="3" fill="url(#waveGrad)" />
    <rect class="w-22" x="632" y="155" width="6" height="10" rx="3" fill="url(#waveGrad)" />
    <rect class="w-23" x="644" y="155" width="6" height="10" rx="3" fill="url(#waveGrad)" />
    <rect class="w-24" x="656" y="155" width="6" height="10" rx="3" fill="url(#waveGrad)" />
  </g>

  <!-- Live Terminal Dialogue Log Stream -->
  <rect x="24" y="188" width="832" height="308" rx="8" fill="#050811" stroke="#1e293b" stroke-width="1" />

  <!-- Turn 1: Ingestion & Dynamic Synthesis -->
  <text x="40" y="212" class="term-code">
    <tspan class="term-dim">[00:00.420] </tspan><tspan class="term-purple">SYS-SYNTH:</tspan>
    <tspan class="term-dim"> Injected 12 firmographic variables into Groq Llama-3.3 70B system prompt (35ms).</tspan>
  </text>

  <!-- Turn 2: Agent Opening -->
  <text x="40" y="236" class="term-code">
    <tspan class="term-dim">[00:00.685] </tspan><tspan class="term-green">AGENT (Sarah):</tspan>
    <tspan> "Hi Sarah, Hamza here from Growth Media in Melbourne—saw your team at Acme expanded your</tspan>
  </text>
  <text x="148" y="254" class="term-code">
    <tspan> WooCommerce catalog (~38 staff). Noticed crawl optimization bottlenecks costing 18% in conversions."</tspan>
  </text>

  <!-- Turn 3: User Response -->
  <text x="40" y="278" class="term-code">
    <tspan class="term-dim">[00:03.210] </tspan><tspan class="term-cyan">PROSPECT (Sarah):</tspan>
    <tspan> "Hey Hamza! Yes, we actually just rolled out 1,200 new SKUs and checkout drop-off has been high."</tspan>
  </text>

  <!-- Turn 4: Agent Objection Handling & Value Pitch -->
  <text x="40" y="302" class="term-code">
    <tspan class="term-dim">[00:07.840] </tspan><tspan class="term-green">AGENT (Sarah):</tspan>
    <tspan> "We engineered a real-time headless sync that recovers 18% in lost checkouts and automates GHL triage.</tspan>
  </text>
  <text x="148" y="320" class="term-code">
    <tspan> Hamza holds 3 architecture feasibility sprints per month. Would Thursday at 10:00 AM work?"</tspan>
  </text>

  <!-- Turn 5: User Acceptance -->
  <text x="40" y="344" class="term-code">
    <tspan class="term-dim">[00:14.500] </tspan><tspan class="term-cyan">PROSPECT (Sarah):</tspan>
    <tspan> "Thursday 10:00 AM works perfectly. Send the calendar invite to my email on file."</tspan>
  </text>

  <!-- Turn 6: Tool Execution GHL Booking -->
  <text x="40" y="368" class="term-code">
    <tspan class="term-dim">[00:15.120] </tspan><tspan class="term-amber">TOOL-CALL [check_and_book_calendar]:</tspan>
    <tspan class="term-dim"> Slot confirmed -> </tspan><tspan class="term-green">2026-09-04T10:00:00+10:00 (AEST)</tspan>
  </text>

  <!-- Turn 7: Agent Confirmation -->
  <text x="40" y="392" class="term-code">
    <tspan class="term-dim">[00:15.820] </tspan><tspan class="term-green">AGENT (Sarah):</tspan>
    <tspan> "Done! Calendar invite and SMS briefing dispatched. Looking forward to speaking Thursday!"</tspan>
  </text>

  <!-- Turn 8: Post-Call Analysis & Telemetry Log -->
  <text x="40" y="420" class="term-code">
    <tspan class="term-dim">[00:18.200] </tspan><tspan class="term-purple">POST-CALL-ANALYTICS:</tspan>
    <tspan class="term-dim"> Duration: 162s | Sentiment: </tspan><tspan class="term-green">Positive (0.92)</tspan>
    <tspan class="term-dim"> | Lead Score: </tspan><tspan class="term-amber">+18 pts</tspan>
    <tspan class="term-dim"> | GHL Sync: </tspan><tspan class="term-cyan">OK</tspan>
  </text>

  <!-- Bottom Result Badges -->
  <g transform="translate(40, 444)">
    <rect x="0" y="0" width="220" height="26" rx="5" fill="#064e3b" stroke="#10b981" stroke-width="1" />
    <text x="110" y="17" text-anchor="middle" fill="#6ee7b7" class="badge-text">✓ QUALIFIED: 100% (DISPO: BOOKED)</text>

    <rect x="232" y="0" width="270" height="26" rx="5" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />
    <text x="367" y="17" text-anchor="middle" fill="#c7d2fe" class="badge-text">📅 APPOINTMENT CONFIRMED: THU 10:00 AM</text>

    <rect x="514" y="0" width="278" height="26" rx="5" fill="#1c1917" stroke="#78716c" stroke-width="1" />
    <text x="653" y="17" text-anchor="middle" fill="#e7e5e4" class="badge-text">⚡ END-TO-END TURNAROUND: 685ms TTFT</text>
  </g>
</svg>
